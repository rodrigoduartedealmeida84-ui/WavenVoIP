<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4C1D95"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4C1D95"/>
      <stop offset="55%"  stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="4" y="4" width="92" height="92" rx="19" ry="19"/>
    </clipPath>
  </defs>

  <!-- Icon mark: rounded square background -->
  <rect x="4" y="4" width="92" height="92" rx="19" ry="19" fill="url(#bgGrad)"/>

  <!-- Headset: headband (bezier arc) -->
  <path d="M 24 49 C 24 22, 76 22, 76 49"
        fill="none" stroke="white" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Earcups -->
  <circle cx="24" cy="49" r="12" fill="white"/>
  <circle cx="76" cy="49" r="12" fill="white"/>

  <!-- Mic boom arm (from left cup) -->
  <line x1="16" y1="56" x2="11" y2="68" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="11" y1="68" x2="5"  y2="68" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="4" cy="68" r="3" fill="white"/>

  <!-- Wave bars -->
  <rect x="19" y="76" width="30" height="4" rx="2" fill="#C4B5FD"/>
  <rect x="22" y="82" width="22" height="4" rx="2" fill="#C4B5FD"/>
  <rect x="26" y="88" width="14" height="4" rx="2" fill="#C4B5FD"/>

  <!-- Text: Waven -->
  <text x="110" y="60"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="40" font-weight="700"
        fill="#1E0B3E">Waven</text>

  <!-- Text: VoIP -->
  <text x="111" y="82"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="400"
        fill="#7C3AED">VoIP</text>
</svg>
