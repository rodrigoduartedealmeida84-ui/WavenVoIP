<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20" fill="url(#bg)"/>

  <!-- Headband (Bezier arc) -->
  <path d="M 22 50 C 22 20, 78 20, 78 50"
        fill="none" stroke="white" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Earcups -->
  <circle cx="22" cy="50" r="13" fill="white"/>
  <circle cx="78" cy="50" r="13" fill="white"/>

  <!-- Mic boom -->
  <line x1="14" y1="58" x2="9"  y2="72" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="9"  y1="72" x2="3"  y2="72" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="2" cy="72" r="3.5" fill="white"/>

  <!-- Wave bars -->
  <rect x="20" y="80" width="30" height="4.5" rx="2.25" fill="#C4B5FD"/>
  <rect x="24" y="87" width="22" height="4.5" rx="2.25" fill="#C4B5FD"/>
</svg>
